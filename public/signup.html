<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAFS • Create Teacher Account</title><link rel="stylesheet" href="./styles.css"></head><body>
<div class="auth-shell"><div class="auth-brand"><img src="./logo.png" alt="DAFS logo"><div><b>DESTINY ACHIEVERS</b><span>FOUNDATION SCHOOL</span></div></div>
<div class="auth-card"><div class="auth-logo"><img src="./logo.png" alt="DAFS logo"></div><div class="eyebrow">TEACHER REGISTRATION</div><h1>Create your account</h1><p>Register with your real name, email address and a password you will keep private.</p><div id="authError" class="alert"></div>
<form id="signupForm" novalidate><div class="field"><label>Full name<input id="name" autocomplete="name"></label></div><div class="field"><label>Email address<input id="email" type="email" autocomplete="email"></label></div><div class="field"><label>Password<input id="password" type="password" autocomplete="new-password"></label></div><button class="primary full">Create teacher account</button></form>
<p class="switch">Already have an account? <a href="./login.html">Sign in</a></p></div></div><script src="./auth.js"></script></body></html>
